# Builds the release APKs of a tag (v*) and attaches them, unsigned, to a
# draft GitHub release. On the release machine `scripts/release.sh
# --from-github <tag>` signs them (the APK key never leaves it), publishes
# the release and puts the APKs on the update hub, as DUORAY does.
#
# DUORAY is checked out next to this repository: duoray-core comes from it.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { path: DUORAY-Mobile }
      - uses: actions/checkout@v7
        with: { repository: m-a-prod/DUORAY, path: DUORAY }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-ndk }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: DUORAY-Mobile
          key: release
      - name: SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Build unsigned APKs
        working-directory: DUORAY-Mobile
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1; }
          code=$(echo "$version" | awk -F'[.-]' '{ print $1 * 10000 + $2 * 100 + $3 }')
          DUORAY_UNSIGNED=1 GRADLE_ARGS="-PversionName=$version -PversionCode=$code -PabiSplit=true" scripts/build-apk.sh release
          mkdir -p out
          for abi in arm64-v8a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release-unsigned.apk" "out/DUORAY-$version-$abi-unsigned.apk"
          done
      - name: Draft release with the unsigned APKs
        working-directory: DUORAY-Mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "DUORAY для Android ${GITHUB_REF_NAME#v}" --notes "Сборка ждёт подписи: scripts/release.sh --from-github $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
