[package]
name = "duoray-mobile"
version = "0.1.6"
edition = "2024"
description = "DUORAY for Android (and later iOS): the desktop client's Slint UI over xray-core's TUN"
license = "GPL-3.0-only"

[lib]
name = "duoray_mobile"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "duoray-preview"
path = "src/bin/preview.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Checked out next to this repository (CI does the same).
duoray-core = { path = "../DUORAY/crates/duoray-core" }
# Updates: the manifest's signature and the download's checksum.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
fastrand = "2.5.0"
log = "0.4.35"
qrcodegen = "1.8.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
ureq = { version = "3.4.2", features = ["socks-proxy", "json"] }
url = "2.5.8"
# Unpacking downloaded xray cores (src/core.rs).
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
jni = "0.22.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
png = "0.18.1"

# Keep dev builds small: full debug info for our crate only.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
